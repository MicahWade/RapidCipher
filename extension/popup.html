<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidCipher</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Main View -->
    <div id="main-view" class="view-container">
        <div class="header">
            <img src="icons/icon-48.png" alt="RapidCipher Logo" class="logo">
            <h3>RapidCipher</h3>
            <button id="settings-button" class="icon-button" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L21.5 6.5V17.5L12 23L2.5 17.5V6.5L12 1ZM12 3.311L4.5 7.653V16.347L12 20.689L19.5 16.347V7.653L12 3.311ZM12 16C10.6092 16 9.42313 15.1765 8.81831 14.0089C8.98634 13.7663 9.1752 13.542 9.3831 13.3341C10.0651 12.6521 10.985 12.25 12 12.25C13.015 12.25 13.9349 12.6521 14.6169 13.3341C14.8248 13.542 15.0137 13.7663 15.1817 14.0089C14.5769 15.1765 13.3908 16 12 16ZM12 8C10.3431 8 9 9.34315 9 11C9 12.6569 10.3431 14 12 14C13.6569 14 15 12.6569 15 11C15 9.34315 13.6569 8 12 8Z"></path></svg>
            </button>
        </div>

        <div id="status-container">
             <p id="status-message" class="status-message"></p>
        </div>

        <!-- Locked View (Bridge Mode) -->
        <div id="locked-view-bridge" class="view" style="display: none;">
            <p>Vault is locked. Unlock via the RapidCipher desktop app.</p>
            <button id="unlock-bridge-button" class="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5C7.305 1.5 3.5 5.305 3.5 10V12H2.5C2.22386 12 2 12.2239 2 12.5V21.5C2 21.7761 2.22386 22 2.5 22H21.5C21.7761 22 22 21.7761 22 21.5V12.5C22 12.2239 21.7761 12 21.5 12H20.5V10C20.5 5.305 16.695 1.5 12 1.5ZM12 3.5C15.59 3.5 18.5 6.41 18.5 10V12H5.5V10C5.5 6.41 8.41 3.5 12 3.5ZM4 14H20V20H4V14Z"></path></svg>
                Unlock with Desktop App
            </button>
        </div>

        <!-- Locked View (Direct Mode) -->
        <div id="locked-view-direct" class="view" style="display: none;">
            <p>Vault is locked. Enter your Master Password to unlock.</p>
            <input type="password" id="direct-password" class="input" placeholder="Master Password">
            <button id="unlock-direct-button" class="button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5C7.305 1.5 3.5 5.305 3.5 10V12H2.5C2.22386 12 2 12.2239 2 12.5V21.5C2 21.7761 2.22386 22 2.5 22H21.5C21.7761 22 22 21.7761 22 21.5V12.5C22 12.2239 21.7761 12 21.5 12H20.5V10C20.5 5.305 16.695 1.5 12 1.5ZM12 3.5C15.59 3.5 18.5 6.41 18.5 10V12H5.5V10C5.5 6.41 8.41 3.5 12 3.5ZM4 14H20V20H4V14Z"></path></svg>
                Unlock
            </button>
        </div>

        <!-- Unlocked View -->
        <div id="unlocked-view" class="view" style="display: none;">
            <input type="text" id="search-bar" class="input" placeholder="Search...">
            <div id="logins-list" class="logins-list">
                <!-- Logins will be populated here -->
            </div>
        </div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view-container" style="display: none;">
        <div class="header">
            <button id="back-button" class="icon-button" title="Back">
                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z"></path></svg>
            </button>
            <h3>Settings</h3>
        </div>

        <div class="setting-item">
            <label for="mode-toggle" class="setting-label">
                <strong>Connection Mode</strong>
                <p>Select how to access your vault.</p>
            </label>
            <select id="mode-toggle" class="input">
                <option value="bridge">Bridge Mode (Recommended)</option>
                <option value="direct">Direct Mode</option>
            </select>
            <p id="mode-description" class="setting-description"></p>
        </div>

        <div class="setting-item">
            <label for="direct-crypto-warning" class="setting-label">
                <strong>"Direct Mode" Crypto</strong>
            </label>
            <p id="direct-crypto-warning" class="setting-description error">
                This extension does not re-implement your Java encryption. "Direct Mode" still uses the Java Native Host, but sends your password to it for a one-time unlock.
            </p>
        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>
